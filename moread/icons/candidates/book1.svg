<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    book1 · 素形：翻开的书，只有轮廓与书脊折缝。
    上缘是 V 形谷（书脊处最低），下缘中间下垂 —— 这两处凹凸是
    16px 下唯一还在的「书」信息，靠它们才能和「两块白条」区分开。
  -->
  <defs>
    <linearGradient id="bk1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E7E5E"/>
      <stop offset="1" stop-color="#245039"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="13.5" fill="url(#bk1)"/>

  <!-- 整本书：两页在书脊底部相连，所以外轮廓是一个 U，而不是两条独立白条 -->
  <path d="M32 21.6
           C28.4 19.2 21.6 17.8 16.6 18.3
           C14.0 18.6 12.6 19.7 12.6 21.8
           L12.6 38.8
           C12.6 41.7 14.0 43.0 16.7 43.4
           C22.2 44.3 28.3 45.2 32 46.9
           C35.7 45.2 41.8 44.3 47.3 43.4
           C50.0 43.0 51.4 41.7 51.4 38.8
           L51.4 21.8
           C51.4 19.7 50.0 18.6 47.4 18.3
           C42.4 17.8 35.6 19.2 32 21.6
           Z"
        fill="#F8F4EB"/>

  <!-- 书脊折缝：透出墨色。宽 3.2 是为了在 16px 下还剩约 0.8px，再窄就看不见了 -->
  <path d="M32 24.4 V 42.2"
        stroke="#2A5A42" stroke-width="3.2" stroke-linecap="round"/>
</svg>
