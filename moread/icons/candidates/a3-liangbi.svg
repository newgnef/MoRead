<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    方案 A3 · 纸上两笔（墨在纸）
    暖纸底 + 两道悬针竖笔：上端圆润、下端收尖，长短错落。
    短的那道不做成等长的第二根 —— 等长竖条会被读成"暂停键"。
  -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#F8F4EB"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#1F2A24" stroke-width="2.4"/>

  <!-- 短笔 -->
  <path d="M20.5 23.5 Q20.5 20 24 20 Q27.5 20 27.5 23.5 L25.9 37 Q24 40.5 22.1 37 Z" fill="#1F2A24"/>
  <!-- 长笔 -->
  <path d="M35.5 21.5 Q35.5 18 39 18 Q42.5 18 42.5 21.5 L40.9 45 Q39 48.5 37.1 45 Z" fill="#1F2A24"/>
</svg>
