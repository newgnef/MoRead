<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    book3 · 带书签：右页垂下一条暖金书签。
    书签是「书」的强符号，用颜色区分开，不依赖细节辨识；
    宽度 4.6 才能在 16px 下保住 1px 以上。
  -->
  <defs>
    <linearGradient id="bk3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E7E5E"/>
      <stop offset="1" stop-color="#245039"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="13.5" fill="url(#bk3)"/>

  <path d="M32 21.6
           C28.4 19.2 21.6 17.8 16.6 18.3
           C14.0 18.6 12.6 19.7 12.6 21.8
           L12.6 38.8
           C12.6 41.7 14.0 43.0 16.7 43.4
           C22.2 44.3 28.3 45.2 32 46.9
           C35.7 45.2 41.8 44.3 47.3 43.4
           C50.0 43.0 51.4 41.7 51.4 38.8
           L51.4 21.8
           C51.4 19.7 50.0 18.6 47.4 18.3
           C42.4 17.8 35.6 19.2 32 21.6
           Z"
        fill="#F8F4EB"/>

  <path d="M32 24.4 V 42.2"
        stroke="#2A5A42" stroke-width="3.2" stroke-linecap="round"/>

  <!-- 书签：从右页上缘垂入书页，末端收成 V 形缺口 -->
  <path d="M41.8 19.5 L46.4 19.9 L46.4 33.6 L44.1 31.6 L41.8 33.6 Z"
        fill="#C9A46A"/>
</svg>
