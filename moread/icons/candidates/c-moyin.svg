<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    方案 C · 墨印
    白文印：满版墨色方印，印面反白出两道竹简。古意最重，
    且「深色块 + 浅色竖条」在 16px 是三类里对比最强的。
  -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#F8F4EB"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#1F2A24" stroke-width="2.4"/>

  <!-- 印面 -->
  <rect x="15" y="15" width="34" height="34" rx="6.5" fill="#1F2A24"/>

  <!-- 反白竹简 -->
  <rect x="24" y="23" width="4.6" height="18" rx="2.3" fill="#F8F4EB"/>
  <rect x="35.4" y="23" width="4.6" height="18" rx="2.3" fill="#F8F4EB"/>

  <!-- 飞白：印面左上被干笔扫过的两道细痕（只在放大时可见，小尺寸自然消失） -->
  <path d="M18 21.5l4-1.6M18.6 27l4-1.4" stroke="#F8F4EB" stroke-width="1.1"
        stroke-linecap="round" opacity="0.42"/>
</svg>
