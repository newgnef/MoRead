<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    book12 · 在 book10 上加纸的质感：轮廓一圈暖灰细边 + 书脊两侧的淡墨影。
    阴影用 clipPath 收在书页内部，16px 时只让边缘略柔，不会变脏。
  -->
  <defs>
    <linearGradient id="bk12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E7E5E"/>
      <stop offset="1" stop-color="#245039"/>
    </linearGradient>
    <linearGradient id="pg12" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#FDFAF3"/>
      <stop offset="1" stop-color="#EBE3D1"/>
    </linearGradient>
    <linearGradient id="spL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFDF7" stop-opacity="0"/>
      <stop offset="1" stop-color="#6B5C3E" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="spR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B5C3E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFDF7" stop-opacity="0"/>
    </linearGradient>

    <path id="bookShape" d="M32 28.0
           C27.8 23.6 20.6 18.4 15.4 17.4
           Q 11.6 16.6 11.5 19.8
           L12.3 37.4
           C12.6 40.3 14.2 41.6 16.8 42.0
           C22.4 42.9 28.6 43.9 32 45.7
           C35.4 43.9 41.6 42.9 47.2 42.0
           C49.8 41.6 51.4 40.3 51.7 37.4
           L52.5 19.8
           Q 52.4 16.6 48.6 17.4
           C 43.4 18.4 36.2 23.6 32 28.0
           Z"/>
    <clipPath id="clip12"><use href="#bookShape"/></clipPath>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="13.5" fill="url(#bk12)"/>

  <use href="#bookShape" fill="url(#pg12)"/>

  <!-- 书脊两侧的淡墨影：靠脊处略深，模拟纸页翻起时的凹陷 -->
  <g clip-path="url(#clip12)">
    <rect x="25.6" y="14" width="6.4" height="34" fill="url(#spL)"/>
    <rect x="38.0" y="14" width="6.4" height="34" fill="url(#spR)"/>
  </g>

  <use href="#bookShape" fill="none" stroke="#DCD1B9" stroke-width="0.9" stroke-opacity="0.85"/>

  <path d="M32 28.6 V 41.4"
        stroke="#1B3A2C" stroke-width="4.2" stroke-linecap="round"/>
</svg>
