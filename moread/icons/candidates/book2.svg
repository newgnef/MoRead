<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    book2 · 有厚度：书页下方露出一层更暗的页缘。
    这一层在 16px 下会被压成一条暗边，正好补上「这不是一块平板」的信息。
  -->
  <defs>
    <linearGradient id="bk2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E7E5E"/>
      <stop offset="1" stop-color="#245039"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="13.5" fill="url(#bk2)"/>

  <!-- 下层页缘（暗暖色），整体比上层下移 2 -->
  <path d="M32 23.6
           C28.4 21.2 21.6 19.8 16.6 20.3
           C14.0 20.6 12.6 21.7 12.6 23.8
           L12.6 40.8
           C12.6 43.7 14.0 45.0 16.7 45.4
           C22.2 46.3 28.3 47.2 32 48.9
           C35.7 47.2 41.8 46.3 47.3 45.4
           C50.0 45.0 51.4 43.7 51.4 40.8
           L51.4 23.8
           C51.4 21.7 50.0 20.6 47.4 20.3
           C42.4 19.8 35.6 21.2 32 23.6
           Z"
        fill="#CBBB9B"/>

  <!-- 上层书页 -->
  <path d="M32 21.6
           C28.4 19.2 21.6 17.8 16.6 18.3
           C14.0 18.6 12.6 19.7 12.6 21.8
           L12.6 38.8
           C12.6 41.7 14.0 43.0 16.7 43.4
           C22.2 44.3 28.3 45.2 32 46.9
           C35.7 45.2 41.8 44.3 47.3 43.4
           C50.0 43.0 51.4 41.7 51.4 38.8
           L51.4 21.8
           C51.4 19.7 50.0 18.6 47.4 18.3
           C42.4 17.8 35.6 19.2 32 21.6
           Z"
        fill="#F8F4EB"/>

  <path d="M32 24.4 V 42.2"
        stroke="#2A5A42" stroke-width="3.2" stroke-linecap="round"/>
</svg>
